    // RENDERIZADO INICIAL
    function renderSongs() {
        const container = document.getElementById('songList');
        container.innerHTML = ''; 

        songs.forEach((song, index) => {
            const id = index + 1;
            const card = document.createElement('div');
            card.className = 'song-card';
            card.id = `song-${id}`;

            card.innerHTML = `
                <input type="checkbox" class="song-checkbox" onchange="toggleFromPlaylist('${id}', '${song.title}')">
                <div class="song-header" onclick="toggle(this)">
                    ${id}. ${song.title}
                    <span class="icon">▼</span>
                </div>
                <div class="song-content">
                    <img src="${song.src}" 
                         loading="lazy" 
                         class="song-img" 
                         onerror="markAsBroken(this)">
                    <div class="search-tags">${song.searchTerms}</div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // --- MANEJO DE IMÁGENES ROTAS (LÓGICA MEJORADA) ---
    function markAsBroken(img) {
        // Marca la tarjeta con una clase especial para que el buscador sepa ignorarla siempre
        const card = img.closest('.song-card');
        card.classList.add('broken-link');
        console.log('Ocultada (No existe):', card.id);
    }

    // Inicialización
    document.addEventListener('DOMContentLoaded', () => {
        renderSongs();
        loadPlaylist();
        processUrlParams();
    });

    // --- FUNCIONES DE LISTA Y INTERACCIÓN ---
    function loadPlaylist() {
        const playlist = JSON.parse(localStorage.getItem('eucaristiaPlaylist')) || [];
        const playlistContainer = document.getElementById('playlist-items');
        playlistContainer.innerHTML = '';
        if (playlist.length === 0) {
            playlistContainer.innerHTML = '<div class="playlist-placeholder">Selecciona canciones abajo...</div>';
            document.querySelectorAll('.song-checkbox').forEach(cb => cb.checked = false);
            return;
        }
        playlist.forEach(song => {
            addVisualItem(song.id, song.title);
            const checkbox = document.querySelector(`#song-${song.id} .song-checkbox`);
            if (checkbox) checkbox.checked = true;
        });
    }

    function toggleFromPlaylist(id, title) {
        let playlist = JSON.parse(localStorage.getItem('eucaristiaPlaylist')) || [];
        const index = playlist.findIndex(item => item.id === id);
        if (index === -1) { playlist.push({ id, title }); addVisualItem(id, title); } 
        else { playlist.splice(index, 1); removeVisualItem(id); }
        localStorage.setItem('eucaristiaPlaylist', JSON.stringify(playlist));
        loadPlaylist();
    }

    function addVisualItem(id, title) {
        if (document.getElementById(`playlist-item-${id}`)) return;
        const list = document.getElementById('playlist-items');
        const placeholder = document.querySelector('.playlist-placeholder');
        if (placeholder) placeholder.remove();
        const li = document.createElement('li');
        li.className = 'playlist-item';
        li.id = `playlist-item-${id}`;
        li.innerHTML = `<a href="#song-${id}" onclick="scrollToSong('song-${id}')">${title}</a>`;
        list.appendChild(li);
    }

    function removeVisualItem(id) {
        const item = document.getElementById(`playlist-item-${id}`);
        if (item) item.remove();
    }

    function clearPlaylist() {
        if(confirm('¿Borrar toda la lista?')) {
            localStorage.removeItem('eucaristiaPlaylist');
            loadPlaylist();
        }
    }

    function scrollToSong(elementId) {
        // CORRECCION 2: Limpiar filtro de búsqueda al hacer clic en la lista
        document.getElementById('searchBar').value = '';
        searchSongs(); // Restaurar visibilidad de todas

        document.querySelectorAll('.song-card').forEach(c => c.classList.remove('active'));
        const element = document.getElementById(elementId);
        if (element) {
            element.classList.add('active');
            setTimeout(() => { // Pequeño retardo para asegurar que el renderizado esté listo
                element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }
    }

    function toggle(header) { header.parentElement.classList.toggle('active'); }

    // --- NUEVAS FUNCIONES ---

    // 1. Share mejorado
    function shareToWhatsapp() {
        const playlist = JSON.parse(localStorage.getItem('eucaristiaPlaylist')) || [];
        if (playlist.length === 0) { alert("Selecciona canciones primero."); return; }
        
        let mensaje = "*REPERTORIO EUCARISTIA*\n\n";
        playlist.forEach((song, index) => { 
            mensaje += `${index + 1}. *${song.title}*\n`; 
        });

        const ids = playlist.map(item => item.id).join(',');
        const baseUrl = window.location.origin + window.location.pathname;
        const shareUrl = baseUrl + '?list=' + ids;

        mensaje += "\nVer repertorio y letras aquí:\n" + shareUrl;

        window.open("https://wa.me/?text=" + encodeURIComponent(mensaje), '_blank');
    }

    // 2. Busqueda delegada
    function searchSongs() {
        filterView();
    }

    // 3. Logica de Tabs y URL
    let currentTab = 'total'; 

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-total').classList.toggle('active', tab === 'total');
        document.getElementById('tab-partial').classList.toggle('active', tab === 'partial');
        filterView();
    }

    function filterView() {
        const playlist = JSON.parse(localStorage.getItem('eucaristiaPlaylist')) || [];
        const selectedIds = new Set(playlist.map(p => String(p.id)));
        
        const cards = document.getElementsByClassName('song-card');
        const searchInput = document.getElementById('searchBar');
        const searchVal = searchInput ? searchInput.value.toUpperCase().trim() : "";

        for (let i = 0; i < cards.length; i++) {
            let card = cards[i];
            let cardId = card.id.replace('song-', '');
            let isSelected = selectedIds.has(cardId);
            let matchesSearch = true;

            if (searchVal !== "") {
                let text = card.innerText || card.textContent;
                if (text.toUpperCase().indexOf(searchVal) === -1) matchesSearch = false;
            }

            if (card.classList.contains('broken-link')) {
                card.style.display = "none"; 
            } else if (currentTab === 'partial' && !isSelected) {
                card.style.display = "none"; 
            } else if (matchesSearch) {
                card.style.display = ""; 
            } else {
                card.style.display = "none"; 
            }
        }
    }

    function processUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const listParam = urlParams.get('list');
        if (listParam) {
            const idsToSelect = listParam.split(',');
            let newPlaylist = [];
            idsToSelect.forEach(idStr => {
                const id = parseInt(idStr); 
                const songIndex = id - 1;   
                if (songs[songIndex]) {
                    newPlaylist.push({ id: String(id), title: songs[songIndex].title });
                }
            });
            localStorage.setItem('eucaristiaPlaylist', JSON.stringify(newPlaylist));
            loadPlaylist(); 
            renderSongs();
            switchTab('partial');
        }
    }

</script>
